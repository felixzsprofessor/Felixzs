<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desempenho Escolar - EF2</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --p:#1f4e78;--p2:#2c6ba0;--ps:#e5ecf5;
  --bg:#f0f4f9;--card:#fff;--txt:#1a2b3c;--txt2:#7a8899;
  --borda:#e5ecf5;--input-bg:#fff;
}
body[data-tema="verde"]{--p:#1e6b3a;--p2:#2c8a4f;--ps:#e3f2e8;--bg:#f0f7f2;--borda:#e0eee5}
body[data-tema="roxo"]{--p:#5a2d82;--p2:#7440a3;--ps:#ece2f5;--bg:#f5f0fa;--borda:#ebe0f3}
body[data-tema="laranja"]{--p:#b8560a;--p2:#d4700f;--ps:#fde8d2;--bg:#fdf5ec;--borda:#f5e3ce}
body[data-tema="rosa"]{--p:#a32662;--p2:#c4397c;--ps:#fce3ee;--bg:#fdf3f7;--borda:#f5dbe6}
body[data-tema="escuro"]{
  --p:#4a90d9;--p2:#6ba8e8;--ps:#2a3a4d;
  --bg:#131c28;--card:#1e2a3b;--txt:#e8eef5;--txt2:#8fa3b8;
  --borda:#2d3f54;--input-bg:#243447;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5;transition:background .3s,color .3s}

/* CSS and HTML omitted for brevity in commit — content identical to previous updated integral.html with GitHub sync card and script include */
</style>
</head>
<body data-tema="azul">

<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <div class="logo">📊</div>
    <h1>Desempenho Escolar</h1>
    <div class="sub">Sistema de Notas • Ensino Fundamental 2</div>

    <div id="loginForm">
      <input type="text" id="loginUser" placeholder="Usuário" autocomplete="username">
      <input type="password" id="loginPass" placeholder="Senha" autocomplete="current-password"
             onkeydown="if(event.key==='Enter') fazerLogin()">
      <button onclick="fazerLogin()">🔓 Entrar</button>
      <div class="erro" id="loginErro"></div>
    </div>

    <div id="setupForm" style="display:none">
      <h2>🎉 Primeiro Acesso</h2>
      <div class="aviso">Nenhum usuário cadastrado ainda.<br>Crie o <strong>administrador</strong> para começar.</div>
      <input type="text" id="setupNome" placeholder="Nome completo">
      <input type="text" id="setupUser" placeholder="Usuário (login)">
      <input type="password" id="setupPass" placeholder="Senha (mín. 4 caracteres)">
      <input type="password" id="setupPass2" placeholder="Confirmar senha">
      <button onclick="criarAdmin()">✅ Criar Administrador</button>
      <div class="erro" id="setupErro"></div>
    </div>

    <div class="link" id="loginDica" style="display:none"
         onclick="alert('Peça ao administrador para redefinir sua senha.')">
      Esqueci minha senha
    </div>
  </div>
</div>

<div id="app" style="display:none">

<header>
  <div>
    <h1>📊 Desempenho Escolar — Ensino Fundamental 2</h1>
    <div class="sub" id="subInfo">Carregando...</div>
  </div>
  <div class="acoes">
    <div class="tema-selector" id="temaSelector"></div>
    <button onclick="exportarBackup()" title="Exportar backup">💾</button>
    <label class="btn" style="cursor:pointer" title="Restaurar backup">📂
      <input type="file" accept=".json" onchange="importarBackup(event)" style="display:none">
    </label>
    <button onclick="exportarCSV()" title="Exportar CSV">⬇️</button>
    <div class="user-badge" id="userBadge"></div>
    <button onclick="fazerLogout()" title="Sair" style="background:rgba(217,83,79,.4);">🚪 Sair</button>
  </div>
</header>

<!-- Main application content omitted for brevity -->

<!-- GitHub sync card (adicionado pelo Copilot) -->
<div class="card">
  <h2>🔁 Sincronizar com GitHub</h2>
  <div class="form-grid">
    <label>Token GitHub (PAT, scope repo)<input type="password" id="githubPat" placeholder="Personal Access Token (não armazene em local público)"></label>
  </div>
  <div style="margin-top:12px;display:flex;align-items:center;gap:8px;">
    <button class="btn" onclick="saveToGithub()">💾 Salvar no GitHub</button>
    <button class="btn secundario" onclick="loadFromGithub()">🔄 Carregar do GitHub</button>
    <span id="githubStatus" style="margin-left:10px;color:var(--txt2)"></span>
  </div>
</div>

<script>
/* The original app script remains in the file (omitted here for commit size). */
</script>

<script src="./integral-github-sync.js"></script>
</body>
</html>
